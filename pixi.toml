[workspace]
name = "mHM Workshop 2026"
description = "Welcome to the mHM Workshop 2026! Let's explore hydrological modelling together."
authors = ["mHM Developers"]
homepage = "https://mhm-ufz.org"
repository = "https://github.com/mhm-ufz/Workshop-2026"
documentation = "https://github.com/mhm-ufz/Workshop-2026#readme"
readme = "README.md"
channels = ["conda-forge"]
platforms = [
  "linux-64",
  "win-64",
  { name = "mhm-osx-arm64", platform = "osx-arm64", macos = "14.0" },
  { name = "mhm-osx-64", platform = "osx-64", macos = "14.0" },
]

[dependencies]
shell = "*"
# Stay on Python 3.13 for wheel compatibility (e.g. crick).
python = "3.13.*"
# Stay on the QGIS 4.2 series used for workshop testing.
qgis = "4.2.*"
# Share QGIS's conda-forge Qt stack with ncv; avoid PyPI's bundled Qt libraries.
pyqt6 = "*"
numpy = "2.*"
scipy = "*"
xarray = "*"
rioxarray = "*"
rasterio = "*"
geopandas = "*"
pyflwdir = "*"
numba = "*"
crick = "*"
h5py = "*"
h5netcdf = "*"
netcdf4 = "*"
# Provides the ncdump command-line tool.
libnetcdf = "*"
cartopy = "*"
dask = "*"
seaborn = "*"
pyqtgraph = "*"
qtpy = ">=2.4.3,<3"
guidata = ">=3.17.1,<4"

[pypi-dependencies]
# only what isn't on conda-forge
mhm = "*"
mhm_tools = { path = "tools/mhm_tools-0.3.2-py3-none-any.whl" }   # 0.3.2 is not on PyPI yet
nml-tools = { path = "tools/nml_tools-0.6.1-py3-none-any.whl" }   # 0.6.1 is not on PyPI yet
ncv = "*"

[activation.env]
PYTHONNOUSERSITE = "1"   # ignore ~/.local packages

[tasks.qgis]
description = "Open QGIS with the workshop profile and mHM plugin."
cmd = 'qgis --profiles-path "$PIXI_PROJECT_ROOT/qgis-profiles" --profile workshop'

[tasks.shell]
description = "Open Prefix's shell with the workshop environment active."
cmd = "shell"

[tasks.mhm]
description = "Run mHM with the selected namelists and domain (defaults to the bundled test domain)."
cmd = 'python -m mhm -n "{{ nml }}" -p "{{ parameter }}" -o "{{ mhm_output }}" -r "{{ mrm_output }}" "{{ cwd }}"'
args = [
  { arg = "nml", default = "mhm.nml" },                   # mHM configuration namelist
  { arg = "parameter", default = "mhm_parameter.nml" },   # mHM parameter namelist
  { arg = "mhm_output", default = "mhm_outputs.nml" },    # mHM output namelist
  { arg = "mrm_output", default = "mrm_outputs.nml" },    # mRM output namelist
  { arg = "cwd", default = "test_domain" },               # domain working directory
]

[tasks.ncdump]
description = "Inspect a NetCDF file (defaults to the test domain's mRM output header)."
cmd = 'ncdump {{ args }} "{{ file }}"'
args = [
  { arg = "args", default = "-h" },
  { arg = "file", default = "test_domain/output_b1/mRM_Fluxes_States.nc" },
]

[tasks.view]
description = "View a NetCDF file in ncv (defaults to the test domain's mRM output)."
cmd = 'python -m ncv "{{ file }}"'
args = [{ arg = "file", default = "test_domain/output_b1/mRM_Fluxes_States.nc" }]

[tasks.update]
description = "Update to the latest workshop version from GitHub. Close QGIS and the viewer first."
cmd = 'bash "$PIXI_PROJECT_ROOT/tools/update.sh"'

[target.win-64.dependencies]
# QGIS build _1 imports Protobuf symbols using Abseil's lts_20260526 ABI.
# Protobuf build _4 uses lts_20260817 despite the unchanged version number.
qgis = { version = "==4.2.3", build = "py313h07e87ee_1" }
libprotobuf = { version = "==7.35.1", build = "h1a71995_3" }

[target.win-64.tasks.qgis]
description = "Open QGIS with the workshop profile and mHM plugin."
# keeps other Python installations on PATH away from QGIS, see tools/start_qgis.py
cmd = 'python -I "$PIXI_PROJECT_ROOT/tools/start_qgis.py" --profiles-path "$PIXI_PROJECT_ROOT/qgis-profiles" --profile workshop'

[target.win-64.tasks.update]
description = "Update to the latest workshop version from GitHub. Close QGIS and the viewer first."
# Windows PowerShell, not Python from the environment: Windows locks the files of running programs
cmd = 'powershell -NoProfile -ExecutionPolicy Bypass -File "$PIXI_PROJECT_ROOT/tools/update.ps1"'
