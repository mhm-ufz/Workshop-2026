name: Installation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
          - name: Windows x86_64
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    env:
      # Use the native Qt backend; Linux gets a virtual X11 display below.
      QT_OPENGL: software
      NCV_OPENGL: "0"

    steps:
      # Check out the same LF files as the ZIP that participants download and
      # the update task installs (Windows runners convert to CRLF by default).
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Choose installation directory
        shell: bash
        run: printf 'WORKSHOP_DIR=%s/mhm-workshop\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth

      # Let the workshop scripts bootstrap Pixi, as they do for participants.
      - name: Install (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash setup.sh --install-dir "$WORKSHOP_DIR"
          printf '%s\n' "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\setup.ps1 -InstallDir $env:WORKSHOP_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.pixi\bin" >> $env:GITHUB_PATH

      - name: Check installation and prepare local changes
        shell: bash
        working-directory: ${{ env.WORKSHOP_DIR }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            exec xvfb-run -a pixi run python "$GITHUB_WORKSPACE/.github/scripts/check_installation.py" --prepare-update
          fi
          pixi run python "$GITHUB_WORKSPACE/.github/scripts/check_installation.py" --prepare-update

      # The update task as participants run it: it downloads this commit as a ZIP
      # and runs its setup script in update mode (PowerShell on Windows).
      - name: Update with the update task
        shell: bash
        working-directory: ${{ env.WORKSHOP_DIR }}
        env:
          WORKSHOP_ZIP_URL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
        run: pixi run update

      - name: Check updated installation and preserved files
        shell: bash
        working-directory: ${{ env.WORKSHOP_DIR }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            exec xvfb-run -a pixi run python "$GITHUB_WORKSPACE/.github/scripts/check_installation.py" --after-update
          fi
          pixi run python "$GITHUB_WORKSPACE/.github/scripts/check_installation.py" --after-update
